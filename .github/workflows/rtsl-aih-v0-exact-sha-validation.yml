name: RTSL AIH V0 exact-SHA validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-exact-corrected-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact corrected PR #16 head
        uses: actions/checkout@v4
        with:
          ref: 9d9e774b87cc4c24f18aa7a415f1cd35c987d933
          fetch-depth: 1

      - name: Verify exact source SHA
        shell: bash
        run: |
          expected='9d9e774b87cc4c24f18aa7a415f1cd35c987d933'
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$expected"
          echo "ACTUAL_SHA=$actual"
          test "$actual" = "$expected"

      - name: Record Python runtime
        run: python3 --version

      - name: Run focused V0 regression suite
        run: python3 -m unittest discover -s tests/ai_harness -p 'test_*.py' -v

      - name: Compile harness and tests
        run: python3 -m compileall -q tools tests
